<section
  id="qa"
  class="main-page section bg-[url('/assets/images/service/qa/qa-bg.jpg')] bg-cover bg-top"
>
  <div
    class="bg-overlay absolute top-0 left-0 w-full h-full 2xl:h-[1500px] 2xl:overflow-hidden"
  >
    <img
      src="../../../../assets/images/service/qa/qa-header.png"
      class="h-full 2xl:h-auto"
      alt="qa-header"
    />
  </div>
  <div
    class="container qa-container relative z-10 max-w-[1600px] mx-auto mt-[27.8rem] px-4 md:px-10"
  >
    <div
      class="qa-wrapper shadow-[0px_10px_10px_#05173d] bg-white px-8 pt-16 pb-6 md:px-16"
    >
      <div class="search-input text-center">
        <div class="input-wrapper relative mx-auto w-full md:w-10/12">
          <input
            type="text"
            class="text-2xl rounded-2xl border-[2px] border-solid border-[#949494] w-full p-2 md:px-8 md:py-6"
          />
          <div
            class="search-icon absolute top-0 right-0 bg-[#090053] rounded-[0_1rem_1rem_0] flex-center cursor-pointer h-full w-[50px] md:w-[80px]"
          >
            <img
              src="../../../assets/images/career/search.png"
              alt="search-icon"
              class="w-[30px] h-[30px] md:w-[60px] md:h-[60px] relative top-1"
            />
          </div>
        </div>
      </div>
      <div class="qas mt-10">
        <a
          class="qa mb-10 p-3 flex justify-between items-center rounded-md shadow-[0px_13px_20px_2px_#000000b3] xs:px-8 xs:py-6"
          *ngFor="let qa of qaList; let i = index"
          [routerLink]="[qa.id]"
        >
          <div class="qa-title md:flex md:items-center">
            <div class="qa-icon-wrapper">
              <img
                src="../../../../assets/images/service/qa/UI_Q.png"
                alt="qa-icon"
                class="w-auto h-[30px] ml-auto mr-auto xs:w-[40px] xs:h-[40px] md:mr-3"
              />
            </div>
            <p
              class="qa-text pr-[4vw] tracking-widest text-lg break-all xs:text-2xl"
            >
              {{ qa.title }}
            </p>
          </div>
          <div class="arrow-icon">
            <img
              src="../../../assets/images/career/arrow.png"
              alt="arrow-icon"
              class="w-[20px] h-[15px] xs:w-[18px] xs:h-[22px]"
            />
          </div>
        </a>
      </div>
    </div>
  </div>

  <app-customer-service-item></app-customer-service-item>
</section>
