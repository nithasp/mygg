<div id="recovery-my-account" class="topic">
  <div class="sub-inner">
    <div class="wrapper">
      <div class="title">
        <img
          src="../../../../assets/images/ticket/UI_Create_mobile 1.png"
          alt="ticket-icon"
        />
        <h1 [innerHTML]="'ticket.recovery_my_account.title' | translate">
          Recovery my account
        </h1>
      </div>
      <form [formGroup]="recoveryMyAccountForm" (ngSubmit)="handleSubmit()">
        <div class="form-wrapper">
          <div class="email item">
            <div class="input-wrapper">
              <label
                for="email"
                [innerHTML]="'ticket.recovery_my_account.email' | translate"
                >Email</label
              >
              <input
                class=""
                id="email"
                type="text"
                placeholder="email@hotmail.com"
                readonly
              />
            </div>
          </div>
          <div class="subject item">
            <div class="input-wrapper">
              <label
                for="subject"
                [innerHTML]="'ticket.recovery_my_account.topic' | translate"
                >How did you lose access to your account ?</label
              >
              <div class="select">
                <app-mygg-select
                  optionPlaceholder="Select"
                  [optionItems]="banTopics"
                  (changeTopic)="handleTopic($event)"
                ></app-mygg-select>
              </div>
              <input type="text" class="hidden" formControlName="subject" />
            </div>
          </div>
          <div class="description item">
            <div class="input-wrapper">
              <label
                for="description"
                [innerHTML]="'ticket.description' | translate"
                >Description</label
              >
              <textarea
                class=""
                id="description"
                type="text"
                placeholder="Placeholder"
                formControlName="description"
              ></textarea>
            </div>
          </div>
          <div class="attachment item">
            <div class="input-wrapper">
              <label
                for="attachment"
                [innerHTML]="'ticket.attachment.title' | translate"
                >Attachment(s)-(Optional)</label
              >
              <app-mygg-dropzone></app-mygg-dropzone>
            </div>
          </div>
        </div>
        <div class="button-wrapper">
          <button
            type="button"
            class="btn-border"
            routerLink="../"
            [innerHTML]="'ticket.back' | translate"
          >
            Back
          </button>
          <button
            type="submit"
            class="btn-filled"
            routerLink="../"
            [innerHTML]="'ticket.submit' | translate"
            [disabled]="recoveryMyAccountForm.status === 'INVALID'"
          >
            Submit
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
