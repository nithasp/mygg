<div id="process-game" class="relative mt-8">
  <div class="inner flex-center">
    <!-- Wait -->
    <div class="content wait text-center" *ngIf="process === 'wait'">
      <div class="msg msg1">Invoice No : XXXXXXXXXXXXXXXXXX</div>
      <div class="msg msg2 mt-3">
        Please open BBL application to make a payment.
      </div>
    </div>

    <!-- Error -->
    <div class="content error text-center" *ngIf="process === 'error'">
      <div class="error-icon">
        <img
          src="/assets/images/method/process/Triangle 6168.png"
          alt="error-icon"
          class="w-[auto] h-[auto] mx-auto"
        />
      </div>
      <div class="msg msg1">Transaction failed</div>
      <div class="msg msg3">Please try a different payment method.</div>
      <div class="submit-button mt-4">
        <button (click)="backToChooseMethodPage()">Try again</button>
      </div>
    </div>

    <!-- Success -->
    <div class="content success text-center" *ngIf="process === 'success'">
      <div class="success-icon">
        <img
          src="/assets/images/method/process/Ellipse 1164.png"
          alt="success-icon"
          class="w-[auto] h-[auto] mx-auto"
        />
      </div>
      <div class="msg msg1">The payment has been completed</div>
      <div class="msg msg2">Payment No. {{transactionOrder || 'XXXXXXXXXXXXXXXXXX'}} </div>
      <div class="msg msg3">Transaction Time : {{transactionCreatedDate || 'DD/MM/YYYY 00:00:00'}} </div>
      <div class="submit-button mt-4">
        <button (click)="backToTopupPage()">Back to site</button>
      </div>
    </div>
  </div>

  <div class="button-wrapper" *ngIf="process === 'wait'">
    <mygg-back-button
      (click)="backToChooseMethodPage()"
      class="absolute bottom-0 left-0"
    ></mygg-back-button>
    <barcode-button
      class="absolute bottom-[2%] right-[3%] cursor-pointer"
      (click)="handlePay()"
      textValue="PAY"
      paddingValue="0 40px"
    ></barcode-button>
  </div>
</div>
